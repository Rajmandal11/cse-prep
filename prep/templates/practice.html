{% extends "base.html" %}
{% block content %}
<h2>Practice</h2>
<div class="card">
  <form method="post">{% csrf_token %}
    <label>Subject</label>
    <select name="subject">
      <option value="">All subjects</option>
      {% for s in subjects %}<option value="{{ s.id }}">{{ s.name }} ({{ s.n }})</option>{% endfor %}
    </select>
    <label>Topic (optional, exact topic name)</label>
    <input name="topic" placeholder="e.g. Percentage, Normalization, Arrays">
    <label>Difficulty</label>
    <select name="difficulty">
      <option value="">All levels</option>
      <option value="easy">Easy</option>
      <option value="medium">Medium</option>
      <option value="hard">Hard</option>
    </select>
    <label>Number of questions</label>
    <input name="count" type="number" value="10" min="1" max="50">
    <button class="btn" type="submit">Start practice</button>
  </form>
</div>
<p style="color:var(--muted)">Practice mode gives instant feedback, full step-by-step solutions, retries and bookmarks. For exam conditions, use <a href="{% url 'test_new' %}">Mock Tests</a> instead.</p>
{% endblock %}
