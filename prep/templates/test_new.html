{% extends "base.html" %}
{% block content %}
<h2>Mock Test Configuration</h2>
<div class="card">
  <form method="post">{% csrf_token %}
    <label>Test name</label><input name="name" value="My Mock Test">
    <label>Mode</label>
    <select name="mode">
      <option value="objective">Objective Test</option>
      <option value="subject">Subject-Wise Test</option>
      <option value="topic">Topic-Wise Test</option>
      <option value="mixed">Mixed Test</option>
      <option value="mock">Full-Length Mock Test</option>
      <option value="custom">Custom Test</option>
    </select>
    <label>Subjects (Ctrl/Cmd-click for several; leave empty for all)</label>
    <select name="subjects" multiple size="8">
      {% for s in subjects %}<option value="{{ s.id }}">{{ s.name }} ({{ s.n }})</option>{% endfor %}
    </select>
    <label>Topics (comma-separated, optional)</label>
    <input name="topics" placeholder="e.g. Percentage, Normalization">
    <label>Difficulty (Ctrl/Cmd-click for several; leave empty for all)</label>
    <select name="difficulties" multiple size="3">
      <option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option>
    </select>
    <label>Number of questions</label><input name="count" type="number" value="20" min="1" max="100">
    <label>Duration (minutes)</label><input name="duration" type="number" value="30" min="1">
    <label>Marks per question</label><input name="marks" type="number" value="4" min="1">
    <label>Negative marks per wrong answer</label><input name="negative" type="number" value="1" min="0">
    <button class="btn" type="submit">Start test</button>
  </form>
</div>
<p style="color:var(--muted)">During a timed test, correct answers and explanations are hidden until you submit. The test auto-submits when time expires.</p>
{% endblock %}
